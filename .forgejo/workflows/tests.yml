# agentctl's own suite on ci-runner (docs/simplification-2026-10.md, item 1). GREEN here is what the auto-pin
# (infra agentctl-autopin) reads before it bumps ci-runner's agentctl-pin.nix to a revision of main.
#
# The `ubuntu-26.04` label is ci-runner's container tier (infra nix/hosts/ci-runner/forgejo.nix `ubuntu`): a fresh
# job container per run (empty HOME, no sdkman, no ~/.cache/agentctl, no ~/projects/movies), and the tests set HOME,
# PATH and git config themselves (tests/harness.py). tests/run.py runs them in parallel, the harness bounds each test
# (60 s), and the whole job is bounded too.
name: tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  suite:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Suite (parallel, 60 s per test)
        run: |
          python3 --version
          timeout -s KILL 420 python3 tests/run.py -j 6 --timeout 60 --suite-timeout 360 --durations 15

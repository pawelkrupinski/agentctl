# agentctl's own suite on a GitHub-hosted runner (github-return plan W5b/W6): GREEN here is what ci-runner's auto-pin
# reads (infra agentctl.nix: agentctl-pin with CI_SOURCE=github, as the agentctl-reader App).
#
# A fresh runner: no HOME state, sdkman or movies clone; the tests set HOME, PATH and git config themselves
# (tests/harness.py). tests/run.py runs them in parallel, the harness bounds each test (60 s), and the job is bounded.
name: tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # TWO SHARDS (2026-11-19): one 4-cpu runner took 290-420 s for the whole suite against its 420 s bound, and two of
  # eight runs on main ended SUITE TIMEOUT with no test failed. Each shard runs a disjoint half (tests/run.py --shard);
  # the run is green only when both are, which is what the auto-pin reads.
  # ON CI-RUNNER'S PYTHON TOO (2026-11-25): 328e158 and 1d742c3 passed here on 3.14 and crashed at import on ci-runner's
  # 3.13 (an un-imported `Any` in an annotation, evaluated at `def` before PEP 649), so ci-runner sat on 68f0e4e for two
  # days. Every shard runs on both; tests/test_annotations.py SERVER_PYTHON names ci-runner's version.
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Suite shard ${{ matrix.shard }}/2 on Python ${{ matrix.python }} (parallel, 60 s per test)
        run: |
          python3 --version
          timeout -s KILL 480 python3 tests/run.py -j 4 --timeout 60 --suite-timeout 420 --durations 15 \
            --shard ${{ matrix.shard }}/2
  # THE SIMULATOR GATE (tests/sim_gate.py): the queue simulator's fixed scenarios, every invariant kind's violations
  # against tests/sim-invariants.tsv and the push's base (no rise, no invariant changed beside the code it measures).
  sim-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Simulator gate
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base="--base $BEFORE"; fi
          git config --global user.email ci@example.invalid && git config --global user.name ci
          timeout -s KILL 840 python3 tests/sim_gate.py -j 4 $base

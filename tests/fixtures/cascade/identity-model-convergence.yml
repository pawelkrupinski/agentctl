# recorded at 11635d5cc (the same at 5f8b24cc, #2473's head): the job graph lines of movies' .github/workflows/identity-model-convergence.yml
name: Identity model convergence
    workflow_dispatch:
jobs:
    preflight:
    leg:
        needs: [ preflight ]
        name: leg (${{ matrix.country }})
        uses: ./.github/workflows/country-convergence-leg.yml
    request-bisect:
        needs: [ preflight, leg ]
        if: ${{ !cancelled() && needs.leg.result == 'failure' && needs.preflight.outputs.on-main == 'true' }}
    timings:
        needs: [ preflight, leg, request-bisect ]
        if: ${{ !cancelled() }}
        uses: ./.github/workflows/report-timings.yml
    drop-measure-branch:
        needs: [ preflight, leg, request-bisect, timings ]
        if: ${{ always() && needs.preflight.outputs.drop-branch == 'true' }}
